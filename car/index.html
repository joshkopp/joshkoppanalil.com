<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>JK Drive</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07080a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080a;--ink:#f1f3ee;--muted:#a6ab9f;--dim:#6c7168;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--acc:#b8f36b;--acc2:#8fd14a;--hot:#ff4f6d;--cy:#2de2ff;--glass:rgba(14,16,14,.72);--ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 14px/1.45 "DM Sans",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.h{font-family:"Space Grotesk",sans-serif;letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono",monospace}
.top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(180deg,rgba(7,8,10,.85),rgba(7,8,10,0))}
.brand{display:flex;align-items:center;gap:10px;font:700 18px "Space Grotesk";white-space:nowrap}
.brand i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--acc);color:#0b0d08;font-style:normal;font-size:17px;box-shadow:0 0 22px rgba(184,243,107,.35)}
.brand b{color:var(--acc)}
.nav{display:flex;gap:4px;padding:4px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-left:8px}
.nav button{border:0;background:none;padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;transition:.25s var(--ease)}
.nav button.on{background:var(--acc);color:#0b0d08}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);display:grid;place-items:center;cursor:pointer;transition:.2s;font-size:15px;text-decoration:none;color:var(--ink)}
.ib:hover{background:rgba(255,255,255,.1)}
.screen{position:fixed;inset:0;z-index:10;display:none}
.screen.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-weight:700;cursor:pointer;transition:transform .15s var(--ease),background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:active{transform:scale(.97)}
.btn.go{background:var(--acc);border-color:transparent;color:#0b0d08;box-shadow:0 10px 30px -10px rgba(184,243,107,.7)}
.btn.go:hover{background:#c8ff7e}
.btn.big{height:56px;font-size:16px;padding:0 28px;border-radius:16px}
.btn.sm{height:34px;padding:0 12px;border-radius:10px;font-size:12.5px}
.lbl{font:700 10.5px "JetBrains Mono";letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
#garage,#drive{pointer-events:none}#garage .gpanel,#drive .hbtns,#drive .tg{pointer-events:auto}
/* garage */
.gpanel{position:absolute;right:16px;top:74px;bottom:16px;width:380px;display:flex;flex-direction:column;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden;animation:slidein .5s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}}
.tabs{display:flex;gap:2px;padding:8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:700;font-size:12.5px;transition:.2s}
.tabs button.on{background:rgba(184,243,107,.14);color:var(--acc)}
.opts{flex:1;overflow-y:auto;padding:16px;scrollbar-width:thin}
.grp{margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:rgba(255,255,255,.03);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:12.5px;transition:.2s}
.chip:hover{border-color:rgba(184,243,107,.5)}
.chip.on{background:var(--acc);color:#0b0d08;border-color:transparent}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;transition:transform .2s var(--pop),box-shadow .2s;position:relative}
.sw:hover{transform:scale(1.1)}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc);transform:scale(1.08)}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sw.pick{background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red)}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bcard{text-align:left;border:1px solid var(--line2);background:rgba(255,255,255,.03);padding:10px 12px;border-radius:14px;cursor:pointer;transition:.2s}
.bcard b{display:block;font:700 14px "Space Grotesk"}.bcard small{color:var(--dim);font-size:11.5px;line-height:1.3;display:block;margin-top:2px}
.bcard.on{border-color:var(--acc);background:rgba(184,243,107,.1);box-shadow:inset 0 0 0 1px var(--acc)}
.num{height:40px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.35);color:var(--ink);padding:0 12px;font:700 15px "JetBrains Mono";width:100%;outline:none}
.num:focus{border-color:var(--acc)}
.gfoot{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.stats{display:grid;gap:7px}
.stat{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .5s var(--ease)}
.gname{position:absolute;left:28px;bottom:26px;max-width:calc(100% - 460px)}
.gname h1{margin:0;font:700 clamp(32px,5vw,64px)/1 "Space Grotesk";letter-spacing:-.03em}
.gname p{margin:6px 0 0;color:var(--muted)}
.hint{position:absolute;left:28px;top:84px;color:var(--dim);font-size:12px}
/* tracks */
#tracks{background:radial-gradient(ellipse at 50% 0%,#1a2112,#07080a 60%)}
.tl{position:absolute;inset:70px 16px 16px;display:grid;grid-template-columns:260px 1fr 260px;gap:16px}
.col{border-radius:20px;background:var(--glass);border:1px solid var(--line);padding:14px;overflow-y:auto;scrollbar-width:thin}
.tcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:10px 12px;border-radius:12px;cursor:pointer;margin-bottom:6px;transition:.2s;position:relative}
.tcard b{display:block;font:700 13.5px "Space Grotesk"}.tcard small{color:var(--dim);font-size:11.5px}
.tcard:hover{border-color:var(--line2)}
.tcard.on{border-color:var(--acc);background:rgba(184,243,107,.08)}
.tcard .x{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:6px;border:0;background:rgba(255,255,255,.06);cursor:pointer;color:var(--dim);font-size:12px}
.edwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:0;min-height:0}
#ed{border-radius:16px;box-shadow:0 30px 80px -30px #000,0 0 0 1px var(--line2);touch-action:none;cursor:crosshair;max-width:100%}
.edbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.tname{background:none;border:0;border-bottom:1px dashed var(--line2);color:var(--ink);font:700 18px "Space Grotesk";text-align:center;outline:none;padding:2px 6px;width:min(320px,100%)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:rgba(255,255,255,.03);padding:9px 10px;border-radius:12px;cursor:pointer;font-weight:700;font-size:12.5px;transition:.2s}
.tool i{font-style:normal;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px}
.tool.on{background:var(--acc);color:#0b0d08;border-color:transparent}
.tip{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.4}
/* hud */
#drive .hud{position:absolute;inset:0;pointer-events:none}
.tl-hud{position:absolute;left:18px;top:72px;display:flex;flex-direction:column;gap:8px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:14px;background:rgba(7,8,10,.6);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:700 14px "JetBrains Mono"}
.pill small{color:var(--dim);font:700 10px "JetBrains Mono";letter-spacing:.12em}
.drift{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .25s}
.drift.on{opacity:1}
.drift b{display:block;font:700 clamp(30px,5vw,54px)/1 "Space Grotesk";color:#fff;text-shadow:0 0 24px rgba(184,243,107,.7)}
.drift span{font:700 13px "JetBrains Mono";letter-spacing:.2em;color:var(--acc)}
.pop{position:absolute;left:50%;top:32%;transform:translateX(-50%);font:700 22px "Space Grotesk";color:var(--acc);text-shadow:0 0 18px rgba(184,243,107,.6);animation:popup 1.4s var(--ease) forwards;white-space:nowrap}
.pop.bad{color:var(--hot);text-shadow:0 0 18px rgba(255,79,109,.6)}
@keyframes popup{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
.gauge{position:absolute;right:18px;bottom:18px}
#mini{position:absolute;right:18px;top:72px;border-radius:16px;box-shadow:0 0 0 1px var(--line2),0 10px 30px rgba(0,0,0,.5)}
.hbtns{position:absolute;right:18px;top:72px;display:flex;flex-direction:column;gap:8px;pointer-events:auto;transform:translateX(-190px)}
.keys{position:absolute;left:18px;bottom:18px;color:rgba(255,255,255,.55);font:500 11.5px "JetBrains Mono";line-height:1.7;background:rgba(7,8,10,.45);padding:10px 12px;border-radius:12px}
.keys b{color:#fff;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:5px;margin-right:4px}
.speedfx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(45,226,255,.12) 75%,rgba(45,226,255,.28))}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.count b{font:700 clamp(80px,16vw,180px)/1 "Space Grotesk";color:#fff;text-shadow:0 0 50px rgba(184,243,107,.8);animation:cnt .9s var(--ease) forwards}
@keyframes cnt{0%{opacity:0;transform:scale(2)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.7)}}
/* touch */
.touch{position:absolute;inset:auto 0 0 0;height:190px;display:none;pointer-events:none;padding:0 14px max(14px,env(safe-area-inset-bottom))}
body.touchui .touch{display:flex;justify-content:space-between;align-items:flex-end}
body.touchui .keys{display:none}
body.touchui .gauge{bottom:auto;top:118px;left:4px;right:auto;transform:scale(.5);transform-origin:top left}
body.touchui #mini{transform:scale(.62);transform-origin:top right}
body.touchui .hbtns{transform:translateX(-126px)}
body.touchui .tl-hud{flex-direction:row;flex-wrap:wrap;max-width:calc(100% - 190px);top:68px;left:8px;gap:6px}
body.touchui .tl-hud .pill{font-size:12px;padding:5px 9px;gap:6px}
.tg{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.tb{width:76px;height:76px;border-radius:24px;border:1px solid var(--line2);background:rgba(20,22,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;font:800 22px "Space Grotesk";color:#fff;touch-action:none}
.tb.sm{width:62px;height:62px;border-radius:18px;font-size:12px;font-family:"JetBrains Mono"}
.tb.gas{height:120px;background:rgba(184,243,107,.22);border-color:rgba(184,243,107,.5)}
.tb.nos{background:rgba(45,226,255,.18);border-color:rgba(45,226,255,.45)}
.tb.down{background:rgba(255,255,255,.28);transform:scale(.95)}
/* modals */
.modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(4,5,4,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modal.on{display:grid;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.card{width:min(420px,calc(100% - 32px));border-radius:24px;background:rgba(14,16,14,.92);border:1px solid var(--line2);padding:26px;text-align:center;box-shadow:0 40px 100px -30px #000;animation:pin .45s var(--pop)}
@keyframes pin{from{transform:scale(.9);opacity:0}}
.card h2{margin:0 0 4px;font:700 30px "Space Grotesk"}
.card p{color:var(--muted);margin:0 0 18px}
.card .btns{display:grid;gap:8px}
.big-time{font:700 54px/1 "JetBrains Mono";color:var(--acc);margin:10px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:50;padding:10px 18px;border-radius:12px;background:rgba(14,16,14,.94);border:1px solid var(--line2);opacity:0;transition:.3s var(--ease);pointer-events:none;font-weight:600}
.toast.on{opacity:1;transform:translateX(-50%)}
#loading{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);transition:opacity .5s}
#loading b{font:700 22px "Space Grotesk"}#loading i{display:block;width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:14px;overflow:hidden}
#loading i:after{content:"";display:block;width:40%;height:100%;background:var(--acc);animation:ld 1s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media(max-width:1000px){
  .tl{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;inset:64px 10px 10px;overflow-y:auto;display:flex;flex-direction:column}
  .col{overflow:visible}
  .tl .list{order:3}.tl .side{order:2}
  .tl .list .tcards{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tl .list .tcard{margin:0}
}
@media(max-width:760px){
  .tl>*{flex-shrink:0}.edwrap{padding-top:4px}
  .tb{width:64px;height:64px;border-radius:18px;font-size:19px}.tb.gas{width:72px;height:104px}.tb.sm{width:52px;height:50px;font-size:11px}.tg{gap:8px}
  .nav button{padding:7px 10px}.brand span{display:none}
  .gpanel{left:10px;right:10px;width:auto;top:auto;bottom:10px;height:52vh}
  .gname{left:16px;bottom:auto;top:70px;max-width:none}.gname h1{font-size:30px}.hint{display:none}
  .gname p{font-size:12px}
  .tools{grid-template-columns:repeat(4,1fr)}.tool{flex-direction:column;gap:2px;font-size:10.5px;padding:7px 4px}
  .tl-hud{top:64px;left:10px}.pill{font-size:12px;padding:6px 10px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading"><div style="text-align:center"><b>JK Drive</b><i></i></div></div>

<header class="top">
  <div class="brand"><i>🏁</i><span>JK <b>Drive</b></span></div>
  <nav class="nav" id="nav"><button data-s="garage">Garage</button><button data-s="tracks">Tracks</button><button data-s="drive">Drive</button></nav>
  <div class="sp"></div>
  <button class="ib" id="snd" title="Sound">🔊</button>
  <a class="ib" href="/" title="Back to joshkoppanalil.com">✕</a>
</header>

<section class="screen" id="garage">
  <div class="hint">Drag to spin the car · scroll to zoom</div>
  <div class="gname"><h1 id="gTitle">My Ride</h1><p id="gSub"></p></div>
  <aside class="gpanel">
    <div class="tabs" id="gTabs"><button data-t="body" class="on">Body</button><button data-t="paint">Paint</button><button data-t="wheels">Wheels</button><button data-t="parts">Parts</button><button data-t="tune">Tune</button></div>
    <div class="opts" id="gOpts"></div>
    <div class="gfoot"><div class="stats" id="gStats"></div><button class="btn go big" id="gNext">Choose a track →</button></div>
  </aside>
</section>

<section class="screen" id="tracks">
  <div class="tl">
    <div class="col list"><div class="lbl">Tracks</div><div class="tcards" id="tPresets"></div><div class="lbl" style="margin-top:14px">My tracks</div><div class="tcards" id="tMine"></div>
      <button class="btn sm" id="tNew" style="width:100%;margin-top:6px">＋ Blank track</button><button class="btn sm" id="tRand" style="width:100%;margin-top:6px">🎲 Surprise me</button></div>
    <div class="edwrap"><input class="tname" id="tName" maxlength="28" spellcheck="false"><canvas id="ed"></canvas>
      <div class="edbar"><button class="btn sm" id="tScen">🌳 Auto scenery</button><button class="btn sm" id="tUndo">↶ Undo</button><button class="btn sm" id="tClear">Clear</button><button class="btn sm" id="tSave">💾 Save</button><button class="btn sm" id="tShare">🔗 Copy link</button></div></div>
    <div class="col side"><div class="lbl">Build</div><div class="tools" id="tTools"></div><div class="tip" id="tTip"></div>
      <div class="lbl" style="margin-top:16px">Mode</div><div class="chips" id="tMode"></div>
      <div class="lbl" style="margin-top:14px">Time of day</div><div class="chips" id="tTime"></div>
      <button class="btn go big" id="tDrive" style="width:100%;margin-top:18px">Drive ▶</button></div>
  </div>
</section>

<section class="screen" id="drive">
  <div class="speedfx" id="speedfx"></div><div class="flash" id="flash"></div>
  <div class="hud">
    <div class="tl-hud" id="hudTL"></div>
    <div class="drift" id="drift"><span id="driftM">DRIFT ×1</span><b id="driftP">0</b></div>
    <div id="pops"></div>
    <canvas id="mini" width="180" height="180"></canvas>
    <div class="hbtns"><button class="ib" id="hCam" title="Camera (C)">🎥</button><button class="ib" id="hPause" title="Pause (Esc)">⏸</button></div>
    <canvas class="gauge" id="gauge" width="220" height="220"></canvas>
    <div class="keys" id="keys"><div><b>W A S D</b> or arrows drive</div><div><b>Space</b> handbrake / drift · <b>Shift</b> nitro</div><div><b>C</b> camera · <b>R</b> reset · <b>H</b> horn · <b>Esc</b> pause</div></div>
    <div class="count" id="count"></div>
  </div>
  <div class="touch" id="touch">
    <div class="tg"><div class="tb" data-k="left">◀</div><div class="tb" data-k="right">▶</div></div>
    <div class="tg"><div style="display:flex;flex-direction:column;gap:10px"><div class="tb sm nos" data-k="nitro">NOS</div><div class="tb sm" data-k="hand">DRIFT</div></div><div class="tb" data-k="brake">■</div><div class="tb gas" data-k="gas">▲</div></div>
  </div>
</section>

<div class="modal" id="pause"><div class="card"><h2>Paused</h2><p id="pInfo"></p><div class="btns">
  <button class="btn go" data-a="resume">Resume</button><button class="btn" data-a="restart">Restart</button>
  <button class="btn" data-a="cam">Camera: <span id="pCam"></span></button><button class="btn" data-a="time">Time: <span id="pTime"></span></button>
  <button class="btn" data-a="tracks">Edit track</button><button class="btn" data-a="garage">Garage</button></div></div></div>
<div class="modal" id="finish"><div class="card"><h2 id="fTitle">Finished!</h2><div class="big-time" id="fTime"></div><p id="fInfo"></p><div class="btns">
  <button class="btn go" data-a="retry">Race again</button><button class="btn" data-a="roam">Free roam this track</button><button class="btn" data-a="tracks">Change track</button></div></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="game.js?v=1"></script>
</body>
</html>
